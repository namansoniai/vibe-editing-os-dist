<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Faceless Kinetic Framework</title>
<!-- Template glimpse: 9 animated 9:16 frames at 1/3 scale (360 x 640 = 1080 x 1920). data-card="1..3" become the gallery card frames (tools/template_frames.py). CSS animations only, 6 s loops. -->
<style>
@font-face{font-family:"Poppins";src:url("../../../../assets/fonts/Poppins-SemiBold.ttf");font-weight:600}
@font-face{font-family:"Poppins";src:url("../../../../assets/fonts/Poppins-Bold.ttf");font-weight:700}
@font-face{font-family:"Poppins";src:url("../../../../assets/fonts/Poppins-Medium.ttf");font-weight:500}
@font-face{font-family:"Instrument Serif";src:url("../../../../assets/fonts/InstrumentSerif-Italic.ttf");font-style:italic}
@font-face{font-family:"Anton";src:url("../../../../assets/fonts/Anton-Regular.ttf")}
@font-face{font-family:"Inter Tight";src:url("../../../../assets/fonts/InterTight-VF.ttf");font-weight:100 900}
:root{--paper:#E9E8E4;--dot:#CFCBC3;--ink:#2F2724;--umber:#3A2E2C;--night:#141414;--hub:#262626;--ghost:#6F6F6F;--mute:#5E5853;--sig:#AE3F18;--sig2:#F2A65A;--vault:#111;
  --eo:cubic-bezier(.22,1,.36,1);--io:cubic-bezier(.65,0,.35,1);--bg:#E9E8E4;--fg:#2F2724;--card:#FFFFFF;--line:#D9D6D0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101010;--fg:#EDEBE7;--card:#1A1A1A;--line:#2A2A2A}}
:root[data-theme="dark"]{--bg:#101010;--fg:#EDEBE7;--card:#1A1A1A;--line:#2A2A2A}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:"Poppins",system-ui,sans-serif;padding:28px 16px 60px}
h1{font:700 22px/1.2 "Poppins";text-align:center;margin-bottom:4px}
p.sub{font:500 13px/1.4 "Poppins";text-align:center;opacity:.7;margin-bottom:22px}
h2{font:600 14px/1 "Inter Tight";letter-spacing:.08em;text-transform:uppercase;opacity:.6;margin:26px auto 12px;max-width:1180px}
.row{display:flex;flex-wrap:wrap;gap:22px;justify-content:center;max-width:1180px;margin:0 auto}
figure{width:360px;max-width:100%}
figcaption{font:500 12px/1.4 "Inter Tight";opacity:.75;margin-top:8px}
.f{width:360px;height:640px;position:relative;overflow:hidden;border-radius:6px;isolation:isolate}
.paper{background-color:var(--paper);background-image:radial-gradient(var(--dot) .75px,transparent 1.05px);background-size:12px 12px}
.umber{background:var(--umber)}
.ink{background-color:var(--night);background-image:radial-gradient(#1F1F1F .7px,transparent 1px);background-size:12px 12px}
.abs{position:absolute}
.sans{font:600 24px/1.06 "Poppins";letter-spacing:-.02em}
.serif{font:italic 400 32px/1.06 "Instrument Serif";letter-spacing:-.01em}
/* generic rise-in with vertical blur, held, then cleared (6 s loop) */
@keyframes rise{0%{opacity:0;transform:translateY(20px);filter:blur(2px)}4%{opacity:1;transform:none;filter:none}88%{opacity:1;transform:none;filter:none}94%,100%{opacity:0;transform:translateY(-14px);filter:blur(3px)}}
.r{opacity:0;animation:rise 6s var(--eo) infinite both}

/* ---- 1 HA-06 hub build + push ---- */
.cam{position:absolute;inset:0;transform-origin:180px 210px;animation:push 6s var(--io) infinite}
@keyframes push{0%,36%{transform:scale(1)}50%,86%{transform:scale(2.4) translateY(0)}96%,100%{transform:scale(1)}}
.title{left:0;right:0;text-align:center;color:var(--ink);font:500 22px/1 "Inter Tight";letter-spacing:-.01em}
.title b{font-weight:800}.title i{font:italic 400 25px "Instrument Serif"}
@keyframes titleout{0%,34%{opacity:1;filter:none;transform:none}40%,100%{opacity:0;filter:blur(4px);transform:translateY(-20px)}}
.tw{display:inline-block;opacity:0;animation:wordin 6s var(--eo) infinite both}
@keyframes wordin{0%{opacity:0;transform:translateY(6px);filter:blur(2px)}3%{opacity:1;transform:none;filter:none}100%{opacity:1}}
.hex{left:127px;top:267px;width:106px;height:106px;background:var(--hub);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;animation:hexin 6s var(--eo) infinite}
@keyframes hexin{0%{transform:scale(.08)}5%,100%{transform:scale(1)}}
.hex b{font:400 40px/1 "Anton"}.hex span{font:700 13px/1 "Inter Tight";margin-top:2px}
.bar{width:77px;height:13px;border-radius:2px;background:var(--hub);opacity:0;animation:barin 6s var(--eo) infinite both}
@keyframes barin{0%{opacity:0;transform:scale(.4)}3%,100%{opacity:1;transform:none}}
.lead{height:1.4px;background:var(--ink);transform-origin:0 50%;opacity:.8}
.typed{left:139px;top:203px;width:78px;height:13px;color:var(--ink);font:600 6.5px/13px "Inter Tight";white-space:nowrap;overflow:hidden;opacity:0;animation:typ 6s steps(16) infinite}
@keyframes typ{0%,45%{opacity:0;width:0}46%{opacity:1;width:0}62%,86%{opacity:1;width:81px}90%,100%{opacity:0}}
.caret{display:inline-block;width:1px;height:8px;background:var(--sig);vertical-align:-1px}
.hdr{left:0;right:0;top:100px;text-align:center;font:700 21px/1 "Poppins";color:var(--ink);opacity:0;animation:hdr 6s var(--eo) infinite}
@keyframes hdr{0%,60%{opacity:0;transform:translateY(12px)}64%,86%{opacity:1;transform:none}90%,100%{opacity:0}}

/* ---- 2 SM-2 giant initial ---- */
.giant{left:21px;top:142px;font:400 367px/1 "Anton";color:var(--ghost);transform-origin:left top;animation:gi 6s var(--eo) infinite}
@keyframes gi{0%{opacity:0;transform:scaleX(.7);filter:blur(4px)}6%{opacity:1;transform:scaleX(.8);filter:none}48%{opacity:1;transform:scaleX(.8)}49.9%{opacity:1}50%,100%{opacity:0}}
.giant.g2{animation-name:gi2}
@keyframes gi2{0%,49.9%{opacity:0;transform:scaleX(.7)}50%{opacity:0;transform:scaleX(.7);filter:blur(4px)}56%{opacity:1;transform:scaleX(.8);filter:none}96%{opacity:1;transform:scaleX(.8)}100%{opacity:0}}
.tuck{font:400 66px/1 "Anton";color:var(--ghost);transform:scaleX(.8);transform-origin:left top;white-space:nowrap}
.lad{left:173px;width:162px;top:300px;text-align:center;color:#fff}
.lad .s{font:500 15px/1.1 "Poppins"}.lad .k{font:700 34px/1.05 "Poppins"}
@keyframes half1{0%{opacity:0;transform:translateY(6px)}4%,46%{opacity:1;transform:none}48%,100%{opacity:0}}
@keyframes half2{0%,51%{opacity:0;transform:translateY(6px)}55%,96%{opacity:1;transform:none}100%{opacity:0}}
.h1{animation:half1 6s var(--eo) infinite both}.h2{opacity:0;animation:half2 6s var(--eo) infinite both}

/* ---- 3 lead card ---- */
.cta{left:0;right:0;top:100px;text-align:center;color:var(--ink);font:600 15.5px/1.25 "Poppins"}
.kw{font-weight:700;position:relative}
.kw:after{content:"";position:absolute;left:0;bottom:-2px;height:2px;background:var(--sig);width:100%;transform-origin:0 50%;animation:ul 6s var(--eo) infinite}
@keyframes ul{0%,14%{transform:scaleX(0)}18%,100%{transform:scaleX(1)}}
.vault{left:37px;top:157px;width:286px;height:286px;border-radius:9px;background:var(--vault);box-shadow:0 6px 16px rgba(0,0,0,.18);padding:14px 14px;animation:vin 6s var(--eo) infinite}
@keyframes vin{0%{opacity:0;transform:translateY(13px);filter:blur(3px)}6%,96%{opacity:1;transform:none;filter:none}100%{opacity:0}}
.vh{font:700 14.5px/1 "Inter Tight";color:#fff;display:flex;gap:7px;align-items:center;margin-bottom:12px}
.vh i{width:13px;height:13px;border:2px solid var(--sig2);border-radius:3px;display:inline-block}
.rw{height:40px;border-bottom:1px solid rgba(255,255,255,.07);display:flex;align-items:center;gap:8px;opacity:0;animation:vin 6s var(--eo) infinite both}
.rw .a{height:6px;border-radius:3px;background:rgba(255,255,255,.16);width:44%}.rw .b{height:6px;border-radius:3px;background:rgba(255,255,255,.09);width:22%}
.rw .c{height:10px;border-radius:5px;background:#2A2A2A;width:28px;margin-left:auto}
.count{left:0;right:0;top:459px;text-align:center;font:700 16px/1 "Poppins";color:var(--ink)}

/* ---- 4 HA-02 hero card + low stack ---- */
.hero{left:108px;top:60px;width:144px;height:225px;border-radius:9px;background:linear-gradient(160deg,#4a4642,#26221f);box-shadow:0 6px 16px rgba(0,0,0,.18);overflow:hidden;animation:settle 6s var(--eo) infinite}
@keyframes settle{0%{transform:scale(1.04);filter:blur(3px)}4%,100%{transform:none;filter:none}}
.hero .q{position:absolute;left:12px;right:12px;top:68px;height:88px;border-radius:6px;background:#fff;padding:8px}
.hero .q div{height:4px;border-radius:2px;background:#d8d8d8;margin:5px 0}
.chip{position:absolute;left:7px;bottom:7px;padding:2px 7px;border-radius:10px;background:rgba(0,0,0,.6);color:#fff;font:700 13px/1.1 "Inter Tight"}
.rep{position:absolute;right:7px;bottom:9px;color:rgba(255,255,255,.75);font:600 8px/1 "Inter Tight";letter-spacing:.08em}
.arrow{left:52px;top:296px}

/* ---- 5 umber context ---- */
.slide{left:90px;top:150px;width:180px;height:320px;border-radius:9px;background:linear-gradient(170deg,#6b5a52,#2a201d);box-shadow:0 6px 16px rgba(0,0,0,.25);animation:sl 6s var(--eo) infinite}
@keyframes sl{0%{transform:translateX(280px);filter:blur(4px)}6%,92%{transform:none;filter:none}100%{opacity:0}}
.ql{position:absolute;left:14px;right:14px;top:150px;background:#fff;border:2px solid #E67E22;border-radius:8px;height:80px;padding:8px}
.ql div{height:4px;border-radius:2px;background:#d3d3d3;margin:6px 0}
.wh{left:0;right:0;top:100px;text-align:center;font:700 21px/1 "Poppins";color:#fff}
.swap{opacity:0}
@keyframes sw1{0%{opacity:0;transform:translateY(12px)}3%,30%{opacity:1;transform:none}32%,100%{opacity:0}}
@keyframes sw2{0%,32%{opacity:0;transform:translateY(12px)}35%,63%{opacity:1;transform:none}65%,100%{opacity:0}}
@keyframes sw3{0%,65%{opacity:0;transform:translateY(12px)}68%,96%{opacity:1;transform:none}100%{opacity:0}}

/* ---- 6 thumb rain + claim ---- */
.tile{position:absolute;border-radius:6px;background:var(--dot);box-shadow:0 3px 10px rgba(0,0,0,.12);animation:drift 6s linear infinite}
@keyframes drift{from{transform:translateY(0)}to{transform:translateY(-110px)}}
.claim{left:0;right:0;top:300px;text-align:center;font:400 54px/1 "Anton";color:var(--mute);letter-spacing:.01em}
.small{font:500 16px/1 "Poppins";color:var(--mute)}
.halo{left:20px;right:20px;top:270px;height:110px;background:radial-gradient(closest-side,rgba(233,232,228,.92),rgba(233,232,228,0))}

/* ---- 7 equation ---- */
.eq{left:0;right:0;text-align:center;color:var(--ink);font:italic 400 32px/1 "Instrument Serif"}

/* ---- 8 themes ---- */
.th{position:absolute;left:0;right:0;height:213px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px}
.th b{font:600 18px/1 "Poppins"}.th i{font:italic 400 24px/1 "Instrument Serif"}.th span{font:600 9px/1 "Inter Tight";letter-spacing:.1em;text-transform:uppercase;opacity:.7}
@keyframes flash{0%,30%{opacity:1}31%,100%{opacity:.35}}

/* ---- 9 captions ---- */
.cs{left:0;right:0;text-align:center;color:var(--ink)}
.tag{left:12px;top:12px;font:600 9px/1 "Inter Tight";letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
</style>
</head>
<body>
<h1>Faceless Kinetic Framework</h1>
<p class="sub">Voice-over only. Type stacks in bold sans and italic serif on warm graph paper; a camera visits your framework; proof sits in rounded cards; it ends on your free resource.</p>

<h2>Format F-A · Kinetic framework</h2>
<div class="row">

<figure>
<div class="f paper" data-card="1">
  <div class="cam">
    <div class="abs title" style="top:100px;animation:titleout 6s var(--eo) infinite"><span class="tw" style="animation-delay:.05s"><b>6</b></span> <span class="tw" style="animation-delay:.3s">ways</span> <span class="tw" style="animation-delay:.45s">to</span> <span class="tw" style="animation-delay:.7s"><b>Hook</b></span> <span class="tw" style="animation-delay:.9s"><b>Viewers</b></span></div>

    <!-- leader lines -->
    <div class="abs lead" style="left:180px;top:320px;width:96px;transform:rotate(-90deg);transform-origin:0 0"></div><div class="abs lead" style="left:180px;top:320px;width:96px;transform:rotate(-30deg);transform-origin:0 0"></div><div class="abs lead" style="left:180px;top:320px;width:96px;transform:rotate(30deg);transform-origin:0 0"></div><div class="abs lead" style="left:180px;top:320px;width:96px;transform:rotate(90deg);transform-origin:0 0"></div><div class="abs lead" style="left:180px;top:320px;width:96px;transform:rotate(150deg);transform-origin:0 0"></div><div class="abs lead" style="left:180px;top:320px;width:96px;transform:rotate(210deg);transform-origin:0 0"></div>
    <div class="abs bar" style="left:141px;top:203px;animation-delay:.1s"></div>
    <div class="abs bar" style="left:237px;top:258px;animation-delay:.17s"></div>
    <div class="abs bar" style="left:237px;top:372px;animation-delay:.23s"></div>
    <div class="abs bar" style="left:141px;top:423px;animation-delay:.3s"></div>
    <div class="abs bar" style="left:46px;top:372px;animation-delay:.37s"></div>
    <div class="abs bar" style="left:46px;top:258px;animation-delay:.43s"></div>
    <div class="abs hex"><b>6</b><span>ways</span></div>
    <div class="abs typed" style="background:var(--paper)">Make them curious<span class="caret"></span></div>
  </div>
  <div class="abs hdr">make them curious</div>
</div>
<figcaption>HA-06 hook: the title builds word by word while the hub grows six redacted bars; the camera pushes into node 1 and its label types.</figcaption>
</figure>

<figure>
<div class="f ink" data-card="2">
  <div class="abs giant">H</div>
  <div class="abs tuck h1" style="left:172px;top:150px">OOK</div>
  <div class="abs lad h1"><div class="s">Make them stop</div><div class="k">scrolling</div></div>
  <div class="abs giant g2">R</div>
  <div class="abs tuck h2" style="left:170px;top:150px;font-size:44px">ELATABLE</div>
  <div class="abs lad h2"><div class="s">see themselves</div><div class="k">in it</div></div>
</div>
<figcaption>SM-2 initial ladder on the ink world: a giant ghost initial, its tucked word, and a white explanation ladder, one letter per part.</figcaption>
</figure>

<figure>
<div class="f paper" data-card="3">
  <div class="abs cta r" style="animation-delay:0s">Comment <span class="kw">"PLAN"</span><br>and I'll send you the link.</div>
  <div class="abs vault">
    <div class="vh"><i></i>The 4-week SLED plan</div>
    <div class="rw" style="animation-delay:.3s"><div class="a"></div><div class="b"></div><div class="c"></div></div>
    <div class="rw" style="animation-delay:.4s"><div class="a"></div><div class="b"></div><div class="c"></div></div>
    <div class="rw" style="animation-delay:.5s"><div class="a"></div><div class="b"></div><div class="c"></div></div>
    <div class="rw" style="animation-delay:.6s"><div class="a"></div><div class="b"></div><div class="c"></div></div>
    <div class="rw" style="animation-delay:.7s"><div class="a"></div><div class="b"></div><div class="c"></div></div>
  </div>
  <div class="abs count r" style="animation-delay:.5s">The free 4-week SLED plan.</div>
</div>
<figcaption>CTA: the keyword line with its signal underline, the dark lead-magnet card, and the count line.</figcaption>
</figure>

<figure>
<div class="f paper">
  <div class="abs hero"><div class="q"><div></div><div style="width:70%"></div><div></div><div style="width:55%"></div></div><div class="chip">◉ 6.7M</div><div class="rep">REPRESENTATIONAL</div></div>
  <svg class="abs arrow r" width="40" height="30" viewBox="0 0 40 30" style="animation-delay:.1s"><path d="M30 26 C10 26 6 14 8 4 M3 9 L8 3 L13 9" fill="none" stroke="#2F2724" stroke-width="1.6" stroke-linecap="round"/></svg>
  <div class="abs cs serif r" style="top:303px;animation-delay:.15s">This is the</div>
  <div class="abs cs sans r" style="top:345px;animation-delay:.6s">Image to</div>
  <div class="abs cs serif r" style="top:378px;animation-delay:1.0s">video</div>
  <div class="abs cs sans r" style="top:420px;animation-delay:1.4s">style</div>
  <div class="abs cs serif r" style="top:453px;animation-delay:1.8s">content</div>
</div>
<figcaption>HA-02 hook: a 9:16 proof card with a view chip at frame 0; the stack builds below, serif first, alternating.</figcaption>
</figure>

<figure>
<div class="f umber">
  <div class="abs wh swap" style="animation:sw1 6s var(--eo) infinite">one of the</div>
  <div class="abs wh swap" style="animation:sw2 6s var(--eo) infinite">easiest</div>
  <div class="abs wh swap" style="animation:sw3 6s var(--eo) infinite">types to create</div>
  <div class="abs slide"><div class="ql"><div></div><div style="width:65%"></div><div></div></div><div class="chip">◉ 2.1M</div></div>
</div>
<figcaption>TH-umber context section: one white header phrase at a time above a card that slides in from the right.</figcaption>
</figure>

<figure>
<div class="f paper">
  <div class="tile" style="left:14px;top:40px;width:50px;height:89px;opacity:.45"></div>
  <div class="tile" style="left:250px;top:20px;width:63px;height:112px;opacity:.7;animation-duration:4s"></div>
  <div class="tile" style="left:120px;top:150px;width:77px;height:137px;opacity:.9;animation-duration:3s"></div>
  <div class="tile" style="left:290px;top:250px;width:50px;height:89px;opacity:.45"></div>
  <div class="tile" style="left:10px;top:300px;width:63px;height:112px;opacity:.5;filter:blur(2px);animation-duration:4s"></div>
  <div class="tile" style="left:200px;top:470px;width:77px;height:137px;opacity:.9;animation-duration:3s"></div>
  <div class="tile" style="left:40px;top:520px;width:50px;height:89px;opacity:.45"></div>
  <div class="tile" style="left:280px;top:560px;width:63px;height:112px;opacity:.7;animation-duration:4s"></div>
  <div class="abs halo"></div>
  <div class="abs cs small r" style="top:286px">It's a</div>
  <div class="abs claim r" style="animation-delay:.3s">4-LETTER FORMULA</div>
  <div class="abs cs small r" style="top:362px;animation-delay:.7s">Top <i style="font:italic 400 19px 'Instrument Serif'">Creators</i> use</div>
</div>
<figcaption>HA-12 hook: the condensed claim over a slow field of reel tiles (the one declared ambient-field exception).</figcaption>
</figure>

<figure>
<div class="f paper">
  <div class="abs eq r" style="top:220px">More loops</div>
  <div class="abs eq r" style="top:262px;animation-delay:.5s">=</div>
  <div class="abs eq r" style="top:300px;animation-delay:.9s">More views</div>
  <div class="abs eq r" style="top:342px;animation-delay:1.4s">=</div>
  <div class="abs eq r" style="top:380px;animation-delay:1.8s">Better reach.</div>
</div>
<figcaption>Equation recap (P-05): serif lines and "=" lines rise into a centred stack.</figcaption>
</figure>
</div>

<h2>Theme packs · switched per section</h2>
<div class="row">
<figure>
<div class="f">
  <div class="th paper" style="top:0;color:var(--ink)"><span>TH-paper</span><b>the framework</b><i>lives here</i></div>
  <div class="th umber" style="top:213px;color:#fff"><span>TH-umber</span><b>context</b><i>with a reference card</i></div>
  <div class="th ink" style="top:426px;color:#fff;height:214px"><span>TH-ink</span><b style="font:400 60px/1 Anton;color:var(--ghost)">H R S T</b><i>the reveal</i></div>
</div>
<figcaption>Paper, umber and ink grounds; flips are hard cuts on section starts, at most three per reel.</figcaption>
</figure>

<figure>
<div class="f paper">
  <div class="abs tag">CS-3 header · CS-1 stack</div>
  <div class="abs wh swap" style="color:var(--ink);top:100px;animation:sw1 6s var(--eo) infinite">get millions</div>
  <div class="abs wh swap" style="color:var(--ink);top:100px;animation:sw2 6s var(--eo) infinite">of views</div>
  <div class="abs wh swap" style="color:var(--ink);top:100px;animation:sw3 6s var(--eo) infinite">every week</div>
  <div class="abs cs sans r" style="top:303px;animation-delay:.2s">Captions</div>
  <div class="abs cs serif r" style="top:336px;animation-delay:.7s">rise into</div>
  <div class="abs cs sans r" style="top:378px;animation-delay:1.2s">a stack</div>
  <div class="abs cs serif r" style="top:411px;animation-delay:1.7s">of five lines</div>
</div>
<figcaption>Caption profiles in English: a bold header phrase above cards, and the alternating kinetic stack.</figcaption>
</figure>
</div>

</html>
